[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ars"
version = "0.1.0"
description = "Modular 2D racing simulator for RL research (Gymnasium-compatible)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
agents = [
    "stable-baselines3>=2.2",
    "torch>=2.1",
]
viz = [
    "pygame>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ars.viz" = ["assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
